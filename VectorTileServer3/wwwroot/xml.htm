    <h1>Können wir XML übergeben ? Siehe Quälcode</h1>

    <script>


        // SELECT TRY_CAST('<root>hell&#xF6;&#xE4;)<bla></bla></root>' AS xml)

        function safeXmlEncode(str)
        {
            let s = String(str || ''); // Ensure input is a string

            let result = [];
            for (let i = 0; i < s.length; i++)
            {
                const charCode = s.charCodeAt(i);

                if (charCode === 38)
                { // &
                    result.push('&amp;');
                }
                else if (charCode === 60)
                { // <
                    result.push('&lt;');
                }
                else if (charCode === 62)
                { // >
                    result.push('&gt;');
                }
                else if (charCode === 34)
                { // "
                    result.push('&quot;');
                }
                else if (charCode === 39)
                { // '
                    result.push('&apos;');
                }
                else if (
                    // Standard printable ASCII characters
                    (charCode >= 0x20 && charCode <= 0x7E) ||
                    // Tab, Newline, Carriage Return (allowed in XML)
                    charCode === 0x9 || charCode === 0xA || charCode === 0xD
                )
                {
                    result.push(s[i]); // Keep as is
                }
                else
                {
                    // Numerically encode all other characters (including non-printable, non-ASCII Unicode)
                    // using hex format for readability (&#xNNNN;)
                    result.push(`&#x${charCode.toString(16).toUpperCase()};`);
                }
            }

            return result.join('');
        }

        function createMioEntity(text)
        {
            const escapedText = safeXmlEncode(text);

            // Construct the XML string
            return `<root><mio><label>${escapedText}</label></mio></root>`;
        }


        function autoStart()
        {
            let exampleText = "Hallöle &amp; äöüçÄÖÜ(``) \"Привет мир\" / 'привіт світ' < & >;";
            let xmlGenerated = createMioEntity(exampleText);
            let logText = "XML (for «" + exampleText + "»): " + xmlGenerated;
            console.log(logText);

            let map = document.getElementById("map");
            map.innerHTML = "";
            map.appendChild(document.createTextNode(logText));
        }

        autoStart();

    </script>
